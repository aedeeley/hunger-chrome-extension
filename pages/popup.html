<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hunger</title><link rel="stylesheet" href="styles.css"><script type="module" src="popup.js"></script></head>
<body class="popup">
  <header class="brand-row"><a class="brand" href="options.html" target="_blank"><span class="mark" aria-hidden="true">h</span>hunger<span class="brand-dot">.</span></a><span class="local-label">MADE FOR YOUR PEACE</span></header>
  <main>
    <section class="popup-hero">
      <span class="status" id="status">Loading protection…</span>
      <h1>A little less<br>temptation.</h1>
      <p>Keep food ordering out of your scroll.</p>
      <div class="orbit" aria-hidden="true"><div class="orbit-core">h</div><span class="orbit-dot"></span></div>
    </section>
    <div class="metrics"><div><strong id="domain-count">—</strong><span>domains covered</span></div><div><strong id="hidden-count">—</strong><span>hidden on this page</span></div></div>
    <section class="popup-controls" aria-label="Protection controls">
      <label class="control-row"><span><strong>Block websites</strong><small>Stop visits to food ordering sites</small></span><input id="blockSites" type="checkbox" role="switch" disabled><span class="switch" aria-hidden="true"></span></label>
      <label class="control-row"><span><strong>Hide mentions & links</strong><small>Clear service names from pages</small></span><input id="hideMentions" type="checkbox" role="switch" disabled><span class="switch" aria-hidden="true"></span></label>
      <label class="control-row"><span><strong>Hide ordering promotions</strong><small>Filter “order food” and similar prompts</small></span><input id="hidePromotions" type="checkbox" role="switch" disabled><span class="switch" aria-hidden="true"></span></label>
    </section>
    <p id="message" class="message" role="status" aria-live="polite"></p>
    <div class="popup-actions"><button id="pause" class="button secondary" disabled>Pause for 15 minutes</button><button id="manage" class="text-button">Manage blocklist <span aria-hidden="true">↗</span></button></div>
  </main>
  <footer class="popup-footer"><span class="tiny-dot"></span> On your device. No tracking. No account.</footer>
</body>
</html>
